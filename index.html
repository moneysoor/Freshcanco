<style>
:root{
  --primary:#0e8a5f; --accent:#ffc83d; --bg:#f6faf8; --ink:#14231d;
  --card:#ffffff; --muted:color-mix(in srgb,var(--ink) 62%,var(--bg)); --line:color-mix(in srgb,var(--ink) 12%,#fff);
  --soft:color-mix(in srgb,var(--primary) 10%,#fff); --danger:#c43d3d; --radius:16px; --font:'Nunito';
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(16,40,30,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font),system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
h1,h2,h3{line-height:1.15;margin:0 0 .5em}
h2{font-size:1.7rem;font-weight:900}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:0;border-radius:999px;padding:.8em 1.4em;font:inherit;font-weight:800;cursor:pointer;background:var(--primary);color:#fff;text-decoration:none;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.btn.small{padding:.45em .9em;font-size:.88rem}
.btn.danger{background:var(--danger)}
.btn.light{background:var(--soft);color:var(--ink)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.demo-bar{background:#fff4cc;color:#5a4500;text-align:center;font-size:.9rem;padding:8px 16px;font-weight:700}
.announce{background:var(--accent);color:#1d1600;text-align:center;font-weight:800;padding:9px 16px}
header.top{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;text-decoration:none;color:var(--ink)}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center}
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2.1rem,5vw,3.3rem);font-weight:900;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(transparent 62%,var(--accent) 62%)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.chip{background:var(--soft);border-radius:999px;padding:.35em .9em;font-weight:700;font-size:.9rem}
.hero-art{aspect-ratio:1;border-radius:calc(var(--radius) + 12px);background:linear-gradient(150deg,var(--primary),color-mix(in srgb,var(--primary) 70%,#000));display:grid;place-items:center;box-shadow:var(--shadow)}
section{padding:44px 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent);font-weight:900;margin-bottom:10px;color:#1d1600}
.price-big{font-size:2.6rem;font-weight:900;color:var(--primary)}
.price-list{list-style:none;padding:0;margin:12px 0 0}
.price-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two.single{grid-template-columns:1fr;max-width:640px;margin:0 auto}
#map,#adminMap{height:340px;border-radius:var(--radius);overflow:hidden;background:var(--soft);z-index:1}
.map-fallback{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.book{max-width:720px;margin:0 auto}
.bstep{border-top:1px solid var(--line);padding:18px 0}
.bstep:first-of-type{border-top:0;padding-top:0}
.bstep h3{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:.9rem;flex:none}
.locked{opacity:.4;pointer-events:none}
label{font-weight:700;font-size:.92rem;display:block;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:.7em .85em;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:#14231d}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.row>.btn{flex:none}
.msg{border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:700}
.msg.ok{background:#dff5e9;color:#0b5c3e}
.msg.bad{background:#fde4e4;color:#8a2020}
.msg.info{background:#eef3ff;color:#26407a}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;font-weight:600;background:#fff;color:#14231d}
.check input{width:20px;height:20px;flex:none;accent-color:var(--primary)}
.check .p{margin-left:auto;font-weight:800}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:1.3rem;font-weight:900;cursor:pointer;color:var(--ink)}
.stepper b{font-size:1.4rem;min-width:1.5em;text-align:center}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.day{flex:none;border:1.5px solid var(--line);background:#fff;color:#14231d;border-radius:14px;padding:8px 12px;text-align:center;cursor:pointer;min-width:78px;font:inherit}
.day small{display:block;color:#5b6b64;font-size:.75rem}
.day b{font-size:1.25rem;display:block}
.day.sel,.time.sel{background:var(--primary);border-color:var(--primary);color:#fff}
.day.sel small{color:#e6fff4}
.day:disabled{opacity:.4;cursor:not-allowed}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.time{border:1.5px solid var(--line);background:#fff;color:#14231d;border-radius:12px;padding:10px 6px;font:inherit;font-weight:800;cursor:pointer}
.time:disabled{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:12px 16px;margin-top:14px;font-weight:800}
.total b{font-size:1.5rem;color:var(--primary)}
.hp{position:absolute;left:-9999px}
details.faq{background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
details.faq summary{font-weight:800;cursor:pointer}
footer{padding:36px 0 50px;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line);margin-top:30px}
.done-card{text-align:center;padding:30px 10px}
.done-card .big{font-size:3rem}
/* admin */
#admin{display:none;background:#f3f6f5;color:#14231d;min-height:100vh;--ink:#14231d;--bg:#f3f6f5}
body.is-admin #site{display:none}
body.is-admin #admin{display:block}
.admin-top{background:#14231d;color:#fff}
.admin-top .wrap{display:flex;justify-content:space-between;align-items:center;height:56px;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0}
.tab{border:0;background:#fff;border-radius:999px;padding:.55em 1.05em;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);color:#14231d}
.tab.sel{background:var(--primary);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem}
.stat span{color:#5b6b64;font-size:.85rem;font-weight:700}
.bk{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;border-left:5px solid var(--primary)}
.bk.done{border-left-color:#8aa39a;opacity:.85}
.bk.cancelled{border-left-color:var(--danger);opacity:.6}
.bk-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bk-meta{color:#5b6b64;font-size:.9rem}
.bk-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:.75rem;font-weight:900;text-transform:uppercase;padding:.2em .6em;border-radius:999px;background:var(--soft)}
.daygroup{font-weight:900;margin:18px 0 8px;color:#5b6b64}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px}
.acard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.acard h3{margin-bottom:.3em}
.list-ed .item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.list-ed .item>*{flex:1}
.x{flex:none!important;width:38px;height:38px;border-radius:10px;border:0;background:#fde4e4;color:var(--danger);font-weight:900;cursor:pointer}
.slotday{padding:12px 0;border-top:1px solid var(--line)}
.slotday:first-of-type{border-top:0}
.slotchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:.3em .4em .3em .8em;font-weight:800;font-size:.9rem}
.tchip button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:900;color:var(--danger)}
.mini{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini input{width:auto;padding:.4em .6em}
.mini select{width:auto;padding:.4em .6em}
.save-bar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 0;margin-top:20px;z-index:500}
.save-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint{color:#5b6b64;font-size:.85rem;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14231d;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.corner-list{counter-reset:c;padding:0;list-style:none;margin:8px 0}
.corner-list li{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.9rem}
.corner-list li::before{counter-increment:c;content:counter(c);width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:.8rem;flex:none}
@media (max-width:760px){
  .hero-grid,.two,.steps{grid-template-columns:1fr}
  .hero-art{display:none}
  .stats{grid-template-columns:1fr 1fr}
  section{padding:32px 0}
}
</style>
</head>

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function toMin(t) { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
function fromMin(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function dayKeyOf(date) { return DAY_KEYS[new Date(date + 'T12:00:00Z').getUTCDay()]; }

/** list of start times ("HH:MM") offered on a date */
function daySlotTimes(settings, date) {
  const ov = settings.dateOverrides && settings.dateOverrides[date];
  const list = ov ? ov : ((settings.hours || {})[dayKeyOf(date)] || []);
  const step = Math.max(5, Number(settings.slotMinutes) || 30);
  const out = [];
  list.forEach(function (x) {
    if (typeof x === 'string' && /^\d{1,2}:\d{2}$/.test(x)) out.push(fromMin(toMin(x)));
    else if (x && x.start && x.end) {
      for (let m = toMin(x.start); m + step <= toMin(x.end); m += step) out.push(fromMin(m));
    }
  });
  return out.filter(function (t, i) { return out.indexOf(t) === i; }).sort();
}

/** now = { date:'YYYY-MM-DD', time:'HH:MM' } in Eastern time */
function buildSlots(settings, booked, now) {
  const out = [];
  const cap = Math.max(1, Number(settings.maxPerSlot) || 1);
  const perDay = Math.max(0, Number(settings.maxPerDay) || 0);
  const notice = Math.max(0, Number(settings.minNoticeHours) || 0) * 60;
  const nowMin = toMin(now.time);
  const blocked = settings.blockedDates || [];
  const days = Math.max(0, Number(settings.daysAhead) || 0);
  for (let i = 0; i <= days; i++) {
    const date = addDays(now.date, i);
    if (blocked.indexOf(date) !== -1) continue;
    let dayCount = 0;
    Object.keys(booked || {}).forEach(function (k) { if (k.indexOf(date + ' ') === 0) dayCount += booked[k]; });
    const dayFull = perDay > 0 && dayCount >= perDay;
    const times = [];
    daySlotTimes(settings, date).forEach(function (t) {
      if (i * 1440 + toMin(t) - nowMin < notice) return;
      let left = cap - ((booked || {})[date + ' ' + t] || 0);
      if (dayFull) left = Math.min(left, 0);
      times.push({ time: t, left: left });
    });
    if (times.length) out.push({ date: date, times: times });
  }
  return out;
}

function findPromo(settings, code) {
  code = String(code || '').trim().toLowerCase();
  if (!code) return null;
  return (settings.promos || []).filter(function (p) {
    return p.enabled !== false && String(p.code || '').trim().toLowerCase() === code;
  })[0] || null;
}

function calcPrice(settings, cans, chosenAddOns, freq, promo) {
  let p = Number(settings.priceFirstCan) + Math.max(0, cans - 1) * Number(settings.priceExtraCan);
  (chosenAddOns || []).forEach(function (a) { p += Number(a.price) || 0; });
  p -= Number((freq && freq.off) || 0);
  if (promo) p -= Number(promo.off) || 0;
  return Math.max(0, p);
}

function effectiveAreaMode(settings) {
  if (settings.areaMode === 'polygon' && (settings.polygon || []).length >= 3) return 'polygon';
  if (settings.areaMode === 'streets' && (settings.allowedStreets || []).filter(String).length) return 'streets';
  return 'radius';
}

function pointInPolygon(lat, lng, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const yi = Number(poly[i].lat), xi = Number(poly[i].lng), yj = Number(poly[j].lat), xj = Number(poly[j].lng);
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function milesBetween(lat1, lng1, lat2, lng2) {
  const R = 3958.8, toR = Math.PI / 180;
  const dLat = (lat2 - lat1) * toR, dLng = (lng2 - lng1) * toR;
  const a = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.pow(Math.sin(dLng / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(a));
}

function normStreet(s) {
  const map = { lane: 'ln', drive: 'dr', road: 'rd', avenue: 'ave', av: 'ave', court: 'ct', street: 'st', circle: 'cir',
    place: 'pl', terrace: 'ter', boulevard: 'blvd', way: 'way', north: 'n', south: 's', east: 'e', west: 'w' };
  return String(s || '').toLowerCase().replace(/[.,]/g, ' ').split(/\s+/).filter(String)
    .map(function (w) { return map[w] || w; }).join(' ');
}

/** merge saved settings onto defaults (keeps new options when the site is updated) */
function mergeSettings(saved) {
  const s = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if (!saved || typeof saved !== 'object' || (Number(saved._v) || 0) < SETTINGS_VERSION) return s;
  Object.keys(saved).forEach(function (k) {
    if (saved[k] && typeof saved[k] === 'object' && !Array.isArray(saved[k]) && s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && k !== 'hours' && k !== 'dateOverrides') {
      s[k] = Object.assign({}, s[k], saved[k]);
    } else s[k] = saved[k];
  });
  s._v = SETTINGS_VERSION;
  return s;
}

function field(label,path,type='text',extra=''){const v=getPath(AD.settings,path);

  return`<div><label>${label}</label><input data-k="${path}" type="${type}" value="${esc(v)}" ${extra}></div>`}

/* ---- Service area ---- */
let areaMap=null;
function tabArea(){
  const s=AD.settings;s.polygon=s.polygon||[];
  const mode=s.areaMode,eff=effectiveAreaMode(s);
  $('#tabBody').innerHTML=`
  <div class="acard"><h3>How should I decide who can book?</h3>
    <select data-k="areaMode" id="modeSel">
      <option value="polygon" ${mode==='polygon'?'selected':''}>Only inside a shape I draw (best for a neighborhood)</option>
      <option value="streets" ${mode==='streets'?'selected':''}>Only on streets in my list</option>
      <option value="radius" ${mode==='radius'?'selected':''}>Within a distance of my home</option></select>
    ${eff!==mode?`<div class="msg info">Right now the site is using the <b>${eff==='radius'?'distance circle':eff}</b> rule, because your ${mode==='polygon'?'shape needs at least 3 corners':'street list is empty'}.</div>`:''}
  </div>
  <div class="acard" ${mode!=='polygon'?'hidden':''}><h3>Draw your neighborhood</h3>
    <p class="hint" style="margin-top:0">Tap the map at each big intersection around your neighborhood (3 corners makes a triangle; add more for a better fit). Drag the numbered pins to fine-tune.</p>
    <div class="row"><div><label>Add a corner by intersection</label><input id="xq" placeholder="e.g. Road A & Road B, Huntingdon Valley, PA"></div><button class="btn" id="xgo">Add corner</button></div>
    <div id="xmsg"></div>
    <ol class="corner-list">${s.polygon.map((p,i)=>`<li>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} <button class="btn small light" data-cdel="${i}">Remove</button></li>`).join('')}</ol>
    <div class="mini"><button class="btn small light" id="cUndo" ${s.polygon.length?'':'disabled'}>Undo last corner</button><button class="btn small light" id="cClear" ${s.polygon.length?'':'disabled'}>Clear shape</button></div></div>
  <div class="acard" ${mode!=='streets'?'hidden':''}><h3>Streets I serve</h3><p class="hint" style="margin-top:0">Type each street name (like "Warfield Ln"). Any house on these streets can book.</p></div>
  ${mode==='streets'?listEditor('Street list','allowedStreets',[{label:'Street name'}]):''}
  <div class="acard" ${mode!=='radius'?'hidden':''}><h3>Distance from home</h3>
    <div class="edit-grid">${field('Miles','radiusMiles','number','min="0.1" step="0.1"')}</div>
    <p class="hint">Your home address is set privately in Code.gs. Tap the map to move the circle that customers see (keep it on the park, not your house).</p></div>
  <div class="acard"><div id="adminMap"></div>
    <div class="edit-grid" style="margin-top:12px">${field('Area name','areaLabel')}</div>
    ${field('Message for people outside the area','outsideMessage','textarea')}</div>
  <div class="acard"><h3>Test an address</h3><p class="hint" style="margin-top:0">Checks with your current (even unsaved) area settings.</p>
    <div class="row"><div><input id="tAddr" placeholder="123 Some St, Huntingdon Valley, PA"></div><button class="btn" id="tGo">Test</button></div><div id="tMsg"></div></div>`;
  const body=$('#tabBody');wireFields(body);if(mode==='streets')wireLists(body);
  $('#modeSel').addEventListener('change',()=>renderAdmin());
  if(mode==='radius')$('[data-k="radiusMiles"]').addEventListener('change',drawAreaMap);
  drawAreaMap();
  if(mode==='polygon'){
    $('#xgo').onclick=async()=>{const q=$('#xq').value.trim();if(!q)return;$('#xgo').disabled=true;
      const r=await api('adminGeocode',{password:PW,query:q});$('#xgo').disabled=false;
      if(!r.ok)return $('#xmsg').innerHTML=`<div class="msg bad">${esc(r.error)}</div>`;
      s.polygon.push({lat:+r.lat.toFixed(6),lng:+r.lng.toFixed(6)});markDirty();toast('Corner added: '+r.found);renderAdmin()};
    $$('[data-cdel]',body).forEach(b=>b.onclick=()=>{s.polygon.splice(+b.dataset.cdel,1);markDirty();renderAdmin()});
    $('#cUndo').onclick=()=>{s.polygon.pop();markDirty();renderAdmin()};
    $('#cClear').onclick=()=>{if(confirm('Remove all corners?')){s.polygon=[];markDirty();renderAdmin()}};
  }
  $('#tGo').onclick=async()=>{const a=$('#tAddr').value.trim();if(!a)return;$('#tGo').disabled=true;
    const r=await api('adminTestAddress',{password:PW,address:a,settings:AD.settings});$('#tGo').disabled=false;
    $('#tMsg').innerHTML=!r.ok?`<div class="msg bad">${esc(r.error)}</div>`:r.inArea?`<div class="msg ok">✓ Can book. Found: ${esc(r.found)}</div>`:`<div class="msg bad">✗ Outside the area. Found: ${esc(r.found)}</div>`};
}
function drawAreaMap(){
  const s=AD.settings,mode=s.areaMode;
  const d=drawMap('adminMap',s,{forceMode:mode==='polygon'?'polygon':mode==='radius'?'radius':'none'});if(!d)return;
  const m=d.map;
  if(mode==='polygon'){
    if(s.polygon.length&&s.polygon.length<3){L.polyline(s.polygon.map(p=>[p.lat,p.lng]),{color:d.color,weight:3,dashArray:'6 6'}).addTo(m);m.fitBounds(L.latLngBounds(s.polygon.map(p=>[p.lat,p.lng])).pad(.6))}
    s.polygon.forEach((p,i)=>{const mk=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${d.color};color:#fff;font-weight:900;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(m);
      mk.on('dragend',e=>{const ll=e.target.getLatLng();s.polygon[i]={lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6)};markDirty();renderAdmin()})});
    m.on('click',e=>{s.polygon.push({lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6)});markDirty();renderAdmin()});
  }else if(mode==='radius'){
    m.on('click',e=>{s.mapCenter={lat:+e.latlng.lat.toFixed(5),lng:+e.latlng.lng.toFixed(5)};markDirty();d.shape&&d.shape.setLatLng(e.latlng)});
  }else{
    m.on('click',e=>{s.mapCenter={lat:+e.latlng.lat.toFixed(5),lng:+e.latlng.lng.toFixed(5)};markDirty();toast('Map center moved')});
  }
}

/* ---- Look ---- */
function tabLook(){
  const s=AD.settings;s.colors=s.colors||{};
  const col=(l,k,d)=>`<div><label>${l}</label><input type="color" data-k="colors.${k}" value="${esc(s.colors[k]||d)}" style="height:48px;padding:4px"></div>`;
  $('#tabBody').innerHTML=`<div class="acard"><h3>Colors</h3><div class="edit-grid">
    ${col('Main color','primary','#0e8a5f')}${col('Highlight','accent','#ffc83d')}${col('Background','bg','#f6faf8')}${col('Text','ink','#14231d')}</div>
    <div class="mini" style="margin-top:12px">${[['Fresh green','#0e8a5f','#ffc83d','#f6faf8','#14231d'],['Ocean','#1769aa','#ffd166','#f4f8fc','#10233a'],['Grape','#6b3fd1','#ffb703','#f7f5ff','#1e1638'],['Sunset','#e4572e','#ffc145','#fff8f3','#2b1a14'],['Night','#25c48a','#ffd23f','#0f1715','#e8f3ee']]
      .map(p=>`<button class="btn small light" data-preset='${JSON.stringify(p.slice(1))}'><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${p[1]}"></span>${p[0]}</button>`).join('')}</div></div>
  <div class="acard"><h3>Font and shape</h3><div class="edit-grid">
    <div><label>Font</label><select data-k="font">${FONTS.map(f=>`<option ${s.font===f?'selected':''}>${f}</option>`).join('')}</select></div>
    ${field('Corner roundness','roundness','range','min="0" max="32"')}</div>
    <p class="hint">Save, then click "View website" to see it.</p></div>`;
  wireFields($('#tabBody'));
  $$('[data-preset]').forEach(b=>b.onclick=()=>{const[p,a,bg,ink]=JSON.parse(b.dataset.preset);Object.assign(s.colors,{primary:p,accent:a,bg,ink});markDirty();renderAdmin()});
}

  <div class="acard"><h3>Your data</h3><p class="hint" style="margin-top:0">Every booking is also saved in your Google Sheet.</p>

/* ===================== router ===================== */
async function route(){
  if(location.hash==='#admin'){
    document.body.classList.add('is-admin');window.scrollTo(0,0);
    if(PW&&AD)renderAdmin();else renderLogin();
  }else if(document.body.classList.contains('is-admin')){
    if(DIRTY&&!confirm('You have unsaved changes. Leave anyway?')){history.replaceState(null,'','#admin');return}
    DIRTY=false;document.body.classList.remove('is-admin');await loadPublic(true);
  }
}
$('#logoutBtn').onclick=()=>{PW='';AD=null;DIRTY=false;location.hash='';};
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
if(DEMO)$('#demoBar').hidden=false;
loadPublic(true).then(route);
</script>
